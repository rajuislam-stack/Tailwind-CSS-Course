<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Class-78 //Topics: Responsive Design with Tailwind CSS, Flexbox and Grid in Tailwind CSS </title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
   <p class="text-red-500 sm:text-blue-500 md:text-green-600">Responsive break point</p>

    <p class="text-sm sm:text-base md:text-lg lg:text-xl xl:text-2xl 2xl:text-3xl">Responsive Text</p>

    <div class="mt-2 grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4">
      <div class="bg-blue-200 p-4">box-1</div>
      <div class="bg-blue-300 p-4">box-2</div>
      <div class="bg-blue-400 p-4">box-3</div>
      <div class="bg-blue-500 p-4">box-4</div>
    </div>


    <div class="mt-4 flex flex-col md:flex-row gap-1">
      <div class="bg-green-200 w-full p-4 md:w-1/2">Left Side</div>
      <div class="bg-green-300 w-full p-4 md:w-1/2">Right Side</div>
    </div>

    <div class="m-4 p-4 bg-white shadow-xl rounded max-w-sm sm:max-w-md md:max-w-lg lg:max-w-xl mx-auto">
      <h1 class="text-gray-800 font-bold text-xl sm:text-2xl">Hello Student!</h1>
      <p class="text-gray-600 text-sm sm:text-base mt-2 ">Welcome to your responsive dashboard!</p>
    </div>

    <div class="grid cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6 m-2 ">
      <div class="bg-white p-4 shadow-lg rounded">Product 1</div>
      <div class="bg-white p-4 shadow-lg rounded">Product 2</div>
      <div class="bg-white p-4 shadow-lg rounded">Product 3</div>
      <div class="bg-white p-4 shadow-lg rounded">Product 4</div>
    </div>


    <div class="m-2 grid gap-3 grid-cols-2 md:grid-cols-4">
      <div class="bg-blue-200 p-4 rounded shadow-lg">Students</div>
      <div class="bg-purple-200 p-4 rounded shadow-lg">Teachers</div>
      <div class="bg-green-200 p-4 rounded shadow-lg">Courses</div>
      <div class="bg-yellow-100 p-4 rounded shadow-lg">Payments</div>
    </div>

</body>
</html>
