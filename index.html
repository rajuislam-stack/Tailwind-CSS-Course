<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Class-77 //Topic: Introduction to TailwindCSS</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <!-- cdn = Content Delivery Network -->

    <h1 class="text-3xl bg-purple-800 font-light">Hello world!</h1>

    <button class="text-2xl bg-blue-600 m-10 px-4 py-2 rounded-xl hover:bg-blue-400">
      Click Me
    </button> <br>

    <button class="text-xl bg-purple-900 text-white font-bold px-4 py-2 rounded-sm m-5 hover:bg-purple-400 hover:rounded-lg">
      Click here
    </button>

    <div class="border h-10 m-10 flex justify-around items-center" >
      <div>left</div>
      <div>right</div>
    </div>

    <div class="border m-8 h-40 grid grid-cols-3 gap-4">
      <div>grid-item1</div>
      <div>grid-item-2</div>
      <div>grid-item-3</div>
    </div>

    <p class="m-4 text-sm sm:text-2xl md:text-3xl lg:text-6xl xl:text-12xl">Responsie Text (All Break Point)</p>
</body>
</html>
